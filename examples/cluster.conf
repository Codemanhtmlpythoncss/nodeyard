# Example nodeyard cluster config (/etc/nodeyard/cluster.conf).
#
# One file describes the whole cluster, so a node (or all of them) can be
# rebuilt from it. Every value here is a placeholder: replace the
# addresses and names with yours, then check it with:
#   sudo nodeyard config import examples/cluster.conf   (validates and shows the diff)
#   nodeyard config validate --help
#
# Format: [section] or [section "name"], then "key = value" lines.
# Lines starting with # or ; are comments. Lists are comma-separated or
# repeated keys. Quote a value to keep a # or ; inside it.
# Secrets (tokens, passwords) never go in this file.

[cluster]
	# A short name for the cluster.
	name = homelab
	# Local DNS domain for node names. home.arpa is reserved for exactly
	# this (RFC 8375); avoid .local, which belongs to mDNS.
	domain = home.arpa
	# A free address on your LAN that always reaches the Kubernetes API,
	# whichever server holds it (high availability, coming in 0.4).
	vip = 192.168.1.9
	# Pin an exact k3s release (recommended once the cluster works)...
	# k3s-version = v1.33.4+k3s1
	# ...or follow a channel: stable, latest or testing.
	k3s-channel = stable

[network]
	# The LAN every node is on, and your router.
	subnet = 192.168.1.0/24
	gateway = 192.168.1.1
	dns = 192.168.1.1
	# The range your router hands out by DHCP (check its settings page).
	# Static addresses for nodes must stay outside it.
	dhcp-range = 192.168.1.100-192.168.1.250
	# Addresses reserved for nodes, and for load-balanced services.
	node-range = 192.168.1.10-192.168.1.29
	lb-range = 192.168.1.30-192.168.1.49
	# The wired interface most nodes use for cluster traffic.
	interface = eth0

# One [node "NAME"] section per machine. NAME is its hostname.

[node "node-1"]
	address = 192.168.1.10/24
	interface = eth0
	# server = control plane (runs etcd); agent = worker; standalone = no k3s
	role = server
	# Exactly one server creates the cluster.
	init = true
	allow-workloads = true
	# Groups place workloads on suitable machines.
	groups = storage
	ssh-user = admin

[node "node-2"]
	address = 192.168.1.11/24
	interface = eth0
	role = server
	server = https://192.168.1.9:6443
	allow-workloads = true
	groups = low-power
	ssh-user = admin

[node "node-3"]
	address = 192.168.1.12/24
	# Mini PCs often name their wired port enp1s0 or similar.
	interface = enp1s0
	role = server
	server = https://192.168.1.9:6443
	allow-workloads = true
	groups = gpu
	ssh-user = admin

[node "node-4"]
	address = 192.168.1.13/24
	interface = eth0
	role = agent
	server = https://192.168.1.9:6443
	groups = low-power
	labels = example.com/rack=shelf-2
	ssh-user = admin
	# Needed later for Wake-on-LAN.
	# mac = 00:00:5e:00:53:01

[ui]
	# auto picks gum > whiptail > dialog > plain prompts.
	backend = auto
	color = auto

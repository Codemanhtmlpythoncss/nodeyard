<svg xmlns="http://www.w3.org/2000/svg" width="872" height="654" viewBox="0 0 872 654" role="img" aria-label="sudo nodeyard worker-info">
<rect width="872" height="654" rx="8" fill="#0d1117"/>
<rect width="872" height="30" rx="8" fill="#161b22"/>
<rect y="22" width="872" height="8" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/>
<circle cx="36" cy="15" r="5.5" fill="#febc2e"/>
<circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="436.0" y="19.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">sudo nodeyard worker-info</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve">
<text x="16.0" y="58" fill="#e6edf3" font-weight="bold">Adding&#160;a&#160;worker&#160;to&#160;this&#160;cluster</text>
<text x="16.0" y="94" fill="#e6edf3">&#160;&#160;Join&#160;address:&#160;&#160;&#160;&#160;</text>
<text x="175.6" y="94" fill="#e6edf3" font-weight="bold">https://192.168.1.10:6443</text>
<text x="385.6" y="94" fill="#e6edf3">&#160;&#160;&#160;</text>
<text x="410.8" y="94" fill="#8b949e" opacity="0.8">(the&#160;worker&#x27;s&#160;--server&#160;value;&#160;port&#160;6443)</text>
<text x="16.0" y="112" fill="#e6edf3">&#160;&#160;Also&#160;reachable:&#160;&#160;https://192.168.1.53:6443&#160;&#160;&#160;</text>
<text x="410.8" y="112" fill="#8b949e" opacity="0.8">(wlan0)</text>
<text x="16.0" y="130" fill="#e6edf3">&#160;&#160;Also&#160;reachable:&#160;&#160;https://100.101.102.103:6443&#160;&#160;&#160;</text>
<text x="436.0" y="130" fill="#8b949e" opacity="0.8">(tailscale)</text>
<text x="16.0" y="148" fill="#e6edf3">&#160;&#160;k3s&#160;version:&#160;&#160;&#160;&#160;&#160;v1.33.4+k3s1&#160;&#160;&#160;</text>
<text x="301.6" y="148" fill="#8b949e" opacity="0.8">(a&#160;worker&#160;must&#160;not&#160;be&#160;newer:&#160;pass&#160;--version)</text>
<text x="16.0" y="166" fill="#e6edf3">&#160;&#160;Join&#160;token:&#160;&#160;&#160;&#160;&#160;&#160;hidden;&#160;show&#160;it&#160;with:&#160;sudo&#160;nodeyard&#160;token&#160;--reveal</text>
<text x="16.0" y="184" fill="#e6edf3">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
<text x="175.6" y="184" fill="#8b949e" opacity="0.8">stored&#160;in&#160;/var/lib/rancher/k3s/server/node-token</text>
<text x="16.0" y="202" fill="#e6edf3">&#160;&#160;Firewall&#160;here:&#160;&#160;&#160;none</text>
<text x="16.0" y="238" fill="#e6edf3" font-weight="bold">Ports&#160;that&#160;must&#160;be&#160;open</text>
<text x="16.0" y="256" fill="#e6edf3">PORT&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;BETWEEN&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;WHAT&#160;FOR&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;OPEN&#160;HERE</text>
<text x="16.0" y="274" fill="#e6edf3">6443/tcp&#160;&#160;&#160;&#160;&#160;&#160;&#160;worker&#160;-&gt;&#160;server&#160;&#160;&#160;Kubernetes&#160;API&#160;(the&#160;join&#160;address)&#160;&#160;open</text>
<text x="16.0" y="292" fill="#e6edf3">10250/tcp&#160;&#160;&#160;&#160;&#160;&#160;server&#160;&lt;-&gt;&#160;worker&#160;&#160;kubelet:&#160;logs,&#160;exec,&#160;metrics&#160;&#160;&#160;&#160;&#160;&#160;&#160;open</text>
<text x="16.0" y="310" fill="#e6edf3">8472/udp&#160;&#160;&#160;&#160;&#160;&#160;&#160;all&#160;nodes&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;pod&#160;network&#160;(flannel&#160;VXLAN)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;open</text>
<text x="16.0" y="328" fill="#e6edf3">51820/udp&#160;&#160;&#160;&#160;&#160;&#160;all&#160;nodes&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;WireGuard&#160;pod&#160;network,&#160;if&#160;enabled&#160;&#160;open</text>
<text x="16.0" y="346" fill="#e6edf3">2379-2380/tcp&#160;&#160;servers&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;etcd&#160;(HA&#160;servers&#160;only)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;open</text>
<text x="16.0" y="364" fill="#8b949e" opacity="0.8">A&#160;worker&#x27;s&#160;own&#160;firewall&#160;must&#160;allow&#160;10250/tcp&#160;and&#160;8472/udp&#160;from&#160;the&#160;other&#160;nodes.</text>
<text x="16.0" y="382" fill="#8b949e" opacity="0.8">Test&#160;from&#160;the&#160;worker:&#160;&#160;curl&#160;-k&#160;https://192.168.1.10:6443/ping&#160;&#160;&#160;(should&#160;print:&#160;pong)</text>
<text x="16.0" y="418" fill="#e6edf3" font-weight="bold">The&#160;worker&#160;machine&#160;needs</text>
<text x="16.0" y="436" fill="#e6edf3">&#160;&#160;-&#160;a&#160;supported&#160;Linux&#160;distro&#160;(nodeyard&#160;detect&#160;shows&#160;this),&#160;systemd,&#160;and&#160;sudo&#160;or&#160;root</text>
<text x="16.0" y="454" fill="#e6edf3">&#160;&#160;-&#160;1&#160;GB+&#160;of&#160;RAM,&#160;and&#160;a&#160;hostname&#160;no&#160;other&#160;node&#160;in&#160;the&#160;cluster&#160;uses</text>
<text x="16.0" y="472" fill="#e6edf3">&#160;&#160;-&#160;a&#160;working&#160;clock&#160;(time&#160;sync),&#160;and&#160;a&#160;network&#160;route&#160;to&#160;192.168.1.10</text>
<text x="16.0" y="508" fill="#e6edf3" font-weight="bold">To&#160;add&#160;it</text>
<text x="16.0" y="526" fill="#e6edf3">&#160;&#160;</text>
<text x="32.8" y="526" fill="#e6edf3" font-weight="bold">From&#160;here,&#160;over&#160;SSH&#160;(easiest):</text>
<text x="16.0" y="544" fill="#e6edf3">&#160;&#160;&#160;&#160;sudo&#160;nodeyard&#160;add-node&#160;worker&#160;--ssh&#160;USER@WORKER_ADDRESS&#160;--interface&#160;eth0</text>
<text x="16.0" y="562" fill="#e6edf3">&#160;&#160;</text>
<text x="32.8" y="562" fill="#e6edf3" font-weight="bold">Or&#160;on&#160;the&#160;worker&#160;itself:</text>
<text x="16.0" y="580" fill="#e6edf3">&#160;&#160;&#160;&#160;1.&#160;curl&#160;-fsSL&#160;https://raw.githubusercontent.com/Codemanhtmlpythoncss/nodeyard/main/install.sh&#160;|…</text>
<text x="16.0" y="598" fill="#e6edf3">&#160;&#160;&#160;&#160;2.&#160;sudo&#160;install&#160;-m&#160;600&#160;/dev/stdin&#160;/root/k3s-token&#160;&#160;&#160;&#160;#&#160;paste&#160;the&#160;token,&#160;then&#160;Ctrl-D</text>
<text x="16.0" y="616" fill="#e6edf3">&#160;&#160;&#160;&#160;3.&#160;sudo&#160;nodeyard&#160;install&#160;worker&#160;--server&#160;https://192.168.1.10:6443&#160;--token-file&#160;/root/k3s-token…</text>
<text x="16.0" y="634" fill="#e6edf3">&#160;&#160;</text>
<text x="32.8" y="634" fill="#8b949e" opacity="0.8">Replace&#160;eth0&#160;with&#160;the&#160;worker&#x27;s&#160;wired&#160;interface&#160;(ip&#160;-br&#160;addr&#160;shows&#160;it).</text>
</g></svg>

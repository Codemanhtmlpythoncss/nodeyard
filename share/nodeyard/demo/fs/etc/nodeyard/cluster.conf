# Demo cluster: three Raspberry Pi 5s and a mini PC on one switch.
[cluster]
	name = demo-yard
	domain = home.arpa
	vip = 192.168.1.9
	k3s-channel = stable

[network]
	subnet = 192.168.1.0/24
	gateway = 192.168.1.1
	dns = 192.168.1.1
	dhcp-range = 192.168.1.100-192.168.1.250
	node-range = 192.168.1.10-192.168.1.29
	lb-range = 192.168.1.30-192.168.1.49
	interface = eth0

[node "yard-1"]
	address = 192.168.1.10/24
	interface = eth0
	role = server
	init = true
	allow-workloads = true
	node-ip = 192.168.1.10
	groups = storage

[node "yard-2"]
	address = 192.168.1.11/24
	interface = eth0
	role = server
	server = https://192.168.1.9:6443
	groups = low-power

[node "yard-3"]
	address = 192.168.1.12/24
	interface = enp1s0
	role = server
	server = https://192.168.1.9:6443
	groups = gpu

[node "yard-4"]
	address = 192.168.1.13/24
	interface = eth0
	role = agent
	server = https://192.168.1.9:6443
	groups = low-power

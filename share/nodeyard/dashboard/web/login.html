<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>Sign in · nodeyard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c8cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg stroke='white' stroke-width='2' stroke-linecap='round' fill='none'%3E%3Ccircle cx='9' cy='10' r='2.4'/%3E%3Ccircle cx='23' cy='12' r='2.4'/%3E%3Ccircle cx='13' cy='23' r='2.4'/%3E%3Cpath d='M11 10.5l10 1.2M10 12.4l2 8.2M21.8 14l-7 7.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<main class="login">
  <form class="card login-card" id="form" autocomplete="off">
    <div class="logo big"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="8" r="2.2"/><circle cx="9" cy="18" r="2.2"/><path d="m8 7 8 1M7 8l2 8M17 10l-6 7"/></svg></div>
    <h1>nodeyard</h1>
    <p class="muted">Enter the dashboard password to continue.</p>
    <label class="field">
      <span class="sr">Dashboard password</span>
      <input class="input" id="key" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" placeholder="Password" autofocus required>
      <button class="btn small ghost" type="button" id="peek" aria-label="Show the password">Show</button>
    </label>
    <div class="login-error" id="error" role="alert" aria-live="polite"></div>
    <button class="btn primary wide" id="go" type="submit">Sign in</button>
    <p class="faint small">Forgot it? On the server run <code>sudo nodeyard dashboard password</code> to set a new one.</p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Galaxy · wall</title>
<style>
/* ================================================================
   WALL HUD — single-layer stylesheet
   ----------------------------------------------------------------
   Read top to bottom:
     1 tokens          6 right rail (#gpu #ops #flows #feeds)
     2 backdrop        7 centre column (#stat #data #chat)
     3 panel chrome    8 floaters (#tour #focuscard #tip)
     4 rails           9 state overrides (inline-style neutralizers)
     5 left rail      10 breakpoints (>=1600, >=2560, short)
   TV SAFE AREA: a wall kiosk overscans ~5% per edge. --sx/--sy
   inset every HUD element; the 3D canvas stays full-bleed.
   RAILS are fixed flex columns: consistent 12px rhythm, #np and
   #flows flex to soak up slack, #legend / #feeds anchor the bottom.
   #alerts collapses via max-height keyed on body.has-alerts, which
   the alert-flash script toggles - the reflow animates smoothly.
   TYPE SCALE (base under 1600px / at 1600px+):
     8px overlines · 8.5/9px headings · 9-10px meta ·
     10/11px rows · 13px tile values · 14/17px identity ·
     16/20px headline numerals (tabular)
   INK RAMP (AA vs panel ground, incl. blurred starfield behind
   the translucent panels - checked vs a star-lightened #131a26):
     --ink1 #e8f0f9 values   --ink2 #9db3cc secondary rows
     --ink3 #7e93ab labels + fine print (5.5:1 worst case)
     --ink4 #6d84a0 decorative only (arrow glyphs, placeholder)
   Colour is signal: accent cyan = identity/charts/interactive,
   amber = degraded/WAN, red = alerts (the only thing that pulses).
   JINJA WARNING: this file is a template. Never let a brace touch
   a hash/percent/brace - write "{ #id" inside media queries.
   Everything brand- or site-specific (title, node names, palette,
   WAN label, which panels exist) comes from GET /api/config via
   static/config.js; nothing in this file names a real estate.
   ================================================================ */

/* ---- 1. tokens ------------------------------------------------- */
:root{
  --fg:#d6ecff;
  --ink1:#e8f0f9; --ink2:#9db3cc; --ink3:#7e93ab; --ink4:#6d84a0;
  --accent:#5ad7ff; --ok:#3ecf8e; --warn:#ffb347; --down:#ff5a6a;
  --line:rgba(148,178,212,.10);
  --edge:rgba(125,160,200,.22);
  --tile-line:rgba(125,160,200,.16);
  --tile-bg:rgba(6,11,22,.55);
  --well:rgba(9,16,30,.9);
  --sx:112px; --sy:64px;        /* TV overscan inset               */
  --railL:228px; --railR:236px; /* rail widths                     */
  --cL:296px; --cR:316px;       /* centre column inset from edges  */
  --gap:12px;                   /* vertical rhythm everywhere      */
}

/* ---- 2. ground + backdrop -------------------------------------- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;color:var(--fg);overflow:hidden;
  font:12.5px/1.45 ui-monospace,Menlo,Consolas,monospace;
  background:radial-gradient(ellipse 120% 80% at 50% 42%,#0a1b3d 0,#040b1e 34%,#01030a 74%,#000 100%)}
#c{position:fixed;inset:0}
body:before{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.7;
  background:
    radial-gradient(55% 38% at 14% 6%,rgba(90,215,255,.06),transparent 70%),
    repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
@keyframes thb{0%,100%{opacity:1}50%{opacity:.45}}

/* ---- 3. panel chrome ------------------------------------------- */
.panel{position:relative;pointer-events:auto;overflow:hidden;
  background:linear-gradient(180deg,rgba(10,16,29,.90),rgba(6,10,20,.84));
  border:1px solid var(--edge);border-radius:6px;padding:7px 10px;
  backdrop-filter:blur(10px);
  box-shadow:0 6px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;opacity:.5;
  background:linear-gradient(90deg,transparent,rgba(160,195,235,.25),transparent)}
#title.panel:before{opacity:.8;
  background:linear-gradient(90deg,transparent,rgba(90,215,255,.65),transparent)}
h3{color:var(--ink3);font-size:8.5px;font-weight:600;letter-spacing:1.3px;
  text-transform:uppercase;margin-bottom:5px;padding-bottom:4px;
  border-bottom:1px solid var(--line)}

/* ---- 4. rails: fixed flex columns, 12px rhythm ------------------ */
#railL,#railR{position:fixed;top:calc(8px + var(--sy));bottom:calc(8px + var(--sy));
  display:flex;flex-direction:column;gap:var(--gap);z-index:5;pointer-events:none}
#railL{left:calc(8px + var(--sx));width:var(--railL)}
#railR{right:calc(8px + var(--sx));width:var(--railR)}
#railL>*,#railR>*{flex:0 0 auto;min-height:0}

/* ---- 5. left rail ---------------------------------------------- */
#title b{font-size:14px;letter-spacing:.5px}
#title b span{color:var(--accent);text-shadow:0 0 12px rgba(90,215,255,.40)}
#title small{display:block;color:var(--ink3);font-size:8.5px;letter-spacing:1.2px;margin-top:1px}
#clockbar{display:flex;gap:4px;align-items:center;margin-top:4px;flex-wrap:wrap}
#clk{font-size:12px;font-weight:600;color:var(--ink1);letter-spacing:.8px;
  font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  font-size:8.5px;letter-spacing:1px;line-height:1.7;text-transform:uppercase;
  padding:1.5px 7px;border-radius:3px;border:1px solid var(--edge);
  background:rgba(9,16,30,.6);color:#a9bfd8;text-decoration:none}
.chip.good:before,.chip.bad:before{content:"";width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.chip.good:before{background:var(--ok);box-shadow:0 0 5px rgba(62,207,142,.7)}
.chip.bad{border-color:rgba(255,90,106,.45);background:rgba(255,90,106,.07);color:#ff8b96}
.chip.bad:before{background:var(--down);box-shadow:0 0 6px var(--down);
  animation:thb 1.6s ease-in-out infinite}
#chip-light i{width:6px;height:6px;border-radius:50%;background:#5ad7ff;box-shadow:0 0 6px currentColor;display:inline-block}
a#nexus-hint{color:var(--accent);border-color:rgba(90,215,255,.35)}

/* #alerts flashes in for ~9s when the alert set changes. It stays
   display:block so the collapse can ANIMATE: the flash script fades
   opacity inline and toggles body.has-alerts, and max-height /
   padding / border transition with it - the rail below reflows
   smoothly instead of jumping. */
#alerts{display:block !important;opacity:0;max-height:0;overflow:hidden;
  padding-top:0;padding-bottom:0;border-width:0;margin-bottom:calc(0px - var(--gap));
  transition:max-height .5s ease,padding .5s ease,margin .5s ease,
             border-width .5s ease,opacity .6s ease,transform .6s ease}
body.has-alerts #alerts{max-height:160px;padding:7px 10px;border-width:1px;margin-bottom:0}
#alerts .a{display:flex;gap:5px;align-items:baseline;padding:2px 0;font-size:9.5px;
  border-bottom:1px solid var(--line)}
#alerts .a:last-child{border-bottom:0}
#alerts .a .sv{width:6px;height:6px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor}
#alerts .a .h{color:#dcefff;font-weight:600;flex:0 0 auto}
#alerts .a .m{color:#8fb0d0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#alerts .more{margin-top:3px;color:var(--ink3);font-size:8.5px;letter-spacing:1px;text-align:right}
#alerts.hot{border-color:rgba(255,90,106,.4);
  box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 22px rgba(255,90,106,.10)}
#alerts.hot h3{color:#ff8b96}
#alerts.hot:before{opacity:1;
  background:linear-gradient(90deg,transparent,rgba(255,90,106,.75),transparent)}

/* ADD-ONS: one block per addons/<id>.py (see docs/contracts.md).
   Hidden entirely when the back end reports none. */
#addonbody{font-size:10px}
.addon{margin:0 0 5px;padding:4px 6px 3px;border:1px solid var(--tile-line);
  border-radius:4px;background:var(--tile-bg)}
.addon:last-child{margin-bottom:0}
.addon .ah{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:9px;
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.addon .ah b{color:var(--ink1);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addon .ah em{font-style:normal;color:var(--ink3);font-size:8px;letter-spacing:.6px}
.addon .pip{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--ink4)}
.addon .pip.up{background:var(--ok);box-shadow:0 0 5px rgba(62,207,142,.7)}
.addon .pip.warn{background:var(--warn);box-shadow:0 0 5px rgba(255,179,71,.6)}
.addon .pip.down{background:var(--down);box-shadow:0 0 6px var(--down);animation:thb 1.6s ease-in-out infinite}
.addon .err{color:#ff8b96;font-size:9px;white-space:normal;word-break:break-word}
.kv b.warn{color:var(--warn)} .kv b.bad{color:var(--down)}

/* #np soaks up the rail between #addons and #legend; overflow scrolls
   (scrollbar hidden) behind a bottom fade instead of a hard clip.  */
#np{flex:1 1 0px;min-height:30px;overflow-y:auto;font-size:10.5px;
  padding-bottom:14px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 16px),transparent)}
#np::-webkit-scrollbar{display:none}
#np .np-sec{margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
#np .np-sec:last-child{border-bottom:0;margin-bottom:0}
#np .np-sec h4{color:var(--ink3);font-size:8.5px;font-weight:600;letter-spacing:1.3px;
  text-transform:uppercase;margin:0 0 3px}
#np .np-hot{border:1px solid rgba(255,90,106,.35);border-radius:4px;
  padding:4px 6px 5px;background:rgba(255,90,106,.05)}
#np .np-hot h4{color:#ff8b96}
#np .np-kv{display:flex;justify-content:space-between;gap:6px;padding:1px 0}
#np .np-kv span{color:var(--ink3)}
#np .np-kv b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
#np .np-row{padding:1px 0;font-size:10px;line-height:1.35;white-space:normal}
#np .np-dim{color:var(--ink3)}
#np .np-sub{color:var(--ink3);font-size:8px;letter-spacing:1.3px;text-transform:uppercase;margin-top:3px}
#np .np-spark{color:var(--accent);letter-spacing:-1px;font-size:9px}

#legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
#legend .r{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--ink3)}
#legend .d{width:6px;height:6px;border-radius:50%;box-shadow:0 0 4px currentColor}

/* ---- 6. right rail --------------------------------------------- */
.hostblock{margin:0 0 5px;padding:5px;border:1px solid var(--tile-line);
  border-radius:4px;background:var(--tile-bg)}
.hostblock:last-child{margin-bottom:0}
.hosttitle{display:flex;justify-content:space-between;color:var(--ink3);font-size:9px;
  letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px;
  font-variant-numeric:tabular-nums}
.gpuchips{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.gpuchip{border:1px solid var(--tile-line);border-radius:4px;padding:3px 4px;
  background:var(--tile-bg);font-size:9px;color:var(--ink2);font-variant-numeric:tabular-nums}
.gpuchip b{display:block;color:var(--ink1);font-size:9.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.gpuchip span{display:flex;justify-content:space-between;color:var(--ink3)}
.gpuchip em{font-style:normal}
.sub{display:flex;gap:6px;color:var(--ink2);font-size:9px;margin-top:1px}
.bar{height:5px;background:var(--well);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2e83b8,var(--accent));
  transition:width .6s}
#gpuhist{margin-top:4px}
#gpuhist svg,#nethist svg{max-width:100%}
#gpuhist svg polyline,#nethist svg polyline{stroke:var(--accent);stroke-width:1.4}
#gpuhist svg:nth-of-type(2) polyline,
#nethist svg:nth-of-type(2) polyline{stroke:#5a7d9e}

#opsgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.op{border:1px solid var(--tile-line);background:var(--tile-bg);border-radius:4px;padding:5px 6px}
.op span{display:block;color:var(--ink3);font-size:8px;letter-spacing:1.1px;text-transform:uppercase}
.op b{display:block;color:var(--ink1);font-size:11.5px;font-weight:600;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.op small{display:block;color:var(--ink2);font-size:9px;margin-top:1px;
  font-variant-numeric:tabular-nums}
.meter{height:3px;border-radius:2px;background:var(--well);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#2e83b8,var(--accent))}

/* live flows: cyan = LAN, amber = crosses the WAN (matches 3D arcs) */
#flows{flex:0 1 auto;min-height:96px}
#flows h3{display:flex;justify-content:space-between;align-items:baseline}
#flowhd{color:var(--ink3);letter-spacing:1px;font-size:8.5px}
#flows .fl{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:3px 0 4px;
  border-bottom:1px solid var(--line)}
#flows .fl:last-child{border-bottom:0}
#flows .fp{font-size:11px;line-height:1.3;color:#dcefff;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#flows .fx{color:var(--ink4);margin:0 5px}
#flows .fb{color:#9ec7e6}
#flows .fr{font-size:11px;line-height:1.3;color:var(--accent);white-space:nowrap;
  font-variant-numeric:tabular-nums}
#flows .fbar{height:2px;border-radius:1px;background:rgba(90,215,255,.10);align-self:center}
#flows .fbar i{display:block;height:100%;border-radius:1px;background:var(--accent);
  box-shadow:0 0 6px var(--accent)}
#flows .fpr{font-size:8px;line-height:1.25;letter-spacing:.8px;color:var(--ink3);
  text-align:right;white-space:nowrap}
#flows .ext .fr{color:var(--warn)}
#flows .ext .fbar i{background:var(--warn);box-shadow:0 0 6px var(--warn)}
#flows .fnone{font-size:11px;color:var(--ink3);padding:6px 0}

#feeds{margin-top:auto}
#feeds .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
#feeds .cam{position:relative;border-radius:4px;overflow:hidden;border:1px solid var(--edge)}
#feeds .cam img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#02030a}
#feeds .cam span{position:absolute;left:0;right:0;bottom:0;padding:6px 4px 2px;
  font-size:8.5px;letter-spacing:.6px;color:#d7e4f2;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.75))}
#feeds .cam:after{content:"LIVE";position:absolute;right:4px;top:3px;font-size:7px;
  letter-spacing:1px;color:#ff9ba5;background:rgba(10,6,8,.88);
  border:1px solid rgba(255,90,106,.35);padding:1px 4px;border-radius:2px}
/* features.cameras false: no NVR configured, so no camera panel and no chip */
body.no-cameras #feeds,body.no-cameras #chip-cam{display:none!important}
body.no-chat #chat{display:none!important}

/* ---- 7. centre column ------------------------------------------ */
#stat{position:fixed;z-index:5;top:calc(8px + var(--sy));
  left:calc(var(--cL) + var(--sx));right:calc(var(--cR) + var(--sx));
  display:flex;justify-content:space-evenly;align-items:center;
  padding:5px 12px;text-align:center}
#stat>div{padding:0 2px}
#stat .n{font-size:16px;font-weight:600;color:var(--ink1);font-variant-numeric:tabular-nums}
#stat .n.ok{color:var(--ink1)}
#stat .n.warn{color:var(--warn)}
#stat .n.bad{color:var(--down);animation:thb 1.6s ease-in-out infinite}
#stat .l{font-size:8px;letter-spacing:1.2px;color:var(--ink3)}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  padding:2.5px 0;min-height:18px;font-size:10px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b{color:var(--ink1);font-weight:600;font-variant-numeric:tabular-nums;
  margin-left:auto;padding-left:10px;text-align:right;white-space:nowrap}

#data{position:fixed;z-index:5;bottom:calc(60px + var(--sy));
  left:calc(var(--cL) + var(--sx));right:calc(var(--cR) + var(--sx));
  display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:1px 14px;align-content:start}
#data h3{grid-column:1;grid-row:1;margin-bottom:2px}
#data #kvs{grid-column:1;grid-row:2/span 3;display:block}
#data #kvs .kv{font-size:9.5px}
#data #nethist{grid-column:2;grid-row:1/span 2}
#data #srcs{grid-column:2;grid-row:3;font-size:9px}
#data #health{grid-column:2;grid-row:4;font-size:9px}

#chat{position:fixed;z-index:5;bottom:calc(8px + var(--sy));left:50%;
  transform:translateX(-50%);width:min(480px,42vw);padding:5px 7px}
#chat .row{display:flex;gap:7px}
#chat input{flex:1;background:rgba(8,14,26,.85);border:1px solid var(--edge);
  color:var(--fg);border-radius:4px;padding:4px 9px;font:inherit;font-size:10.5px;outline:none}
#chat input::placeholder{color:var(--ink4)}
#chat input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(90,215,255,.14)}
#chat button{background:var(--accent);color:#04121b;border:0;border-radius:4px;
  padding:0 12px;font-weight:600;font-size:10.5px;cursor:pointer}
#chat button:hover{filter:brightness(1.1)}
#chat .out{color:var(--ink2);margin-top:4px;max-height:28px;overflow:hidden;
  white-space:pre-wrap;font-size:9.5px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical}
#chat .out:empty{display:none;margin:0}

/* ---- 8. floaters ------------------------------------------------ */
#tour{position:fixed;z-index:5;top:calc(72px + var(--sy));left:50%;
  transform:translateX(-50%);font-size:8.5px;letter-spacing:1.4px;color:#8fa6bd;
  transition:opacity .5s}
#focuscard{position:fixed;z-index:5;left:50%;top:calc(66px + var(--sy));
  transform:translateX(-50%);min-width:260px;max-width:380px;text-align:center;
  opacity:0;transition:opacity .4s;pointer-events:none;padding:8px 12px}
#focuscard .fn{font-size:14px;font-weight:700;color:#fff;letter-spacing:.5px}
#focuscard .fm{display:flex;gap:12px;justify-content:center;margin-top:4px}
#focuscard .fm div{font-size:10px;color:var(--ink2)}
#focuscard .fm b{display:block;font-size:12px;color:#dcefff}
#focuscard .ftag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 8px;border-radius:3px}
#tip{position:fixed;pointer-events:none;background:rgba(4,10,22,.96);
  border:1px solid rgba(125,160,200,.4);border-radius:4px;padding:5px 9px;
  font-size:11px;display:none;z-index:9;white-space:nowrap}

/* ---- 9. neutralize JS-inlined greens: nominal reads neutral ----- */
/* attribute selector + important is the only pure-CSS way to beat an
   inline style; red / amber state inlines stay untouched.           */
#kvs [style*="#37f5a0"],
#addonbody [style*="#37f5a0"],
#health [style*="#37f5a0"],
#opsgrid [style*="#37f5a0"],
#np [style*="#37f5a0"],
#focuscard .fm b[style*="#37f5a0"]{color:var(--ink1)!important;text-shadow:none!important}
/* data-source dots stay a QUIET green - indicators, not text */
#srcs [style*="#37f5a0"]{color:#4faf83!important}

/* ---- 10. breakpoints ------------------------------------------- */
@media (min-width:1600px){
  :root{--railL:280px;--railR:300px;--cL:320px;--cR:340px}
  .panel{padding:10px 12px}
  h3{font-size:9px}
  #title b{font-size:17px}
  #title small{font-size:9.5px}
  #clk{font-size:14px}
  body.has-alerts #alerts{padding:10px 12px}
  #alerts .a{font-size:10.5px}
  #addonbody{font-size:11px}
  .kv{font-size:11px}
  #legend .r{font-size:10px}
  .gpuchip{font-size:10px}
  .gpuchip b{font-size:10.5px}
  .op b{font-size:13px}
  .op small{font-size:10px}
  #feeds .cam span{font-size:9px}
  #stat{padding:7px 16px}
  #stat .n{font-size:20px}
  #data{grid-template-columns:minmax(0,1fr) 280px;gap:2px 18px}
  #data #kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
  #data #kvs .kv{font-size:10.5px}
  #data #srcs,#data #health{font-size:10px}
  #chat{width:min(560px,36vw)}
  #chat input{padding:6px 10px;font-size:11.5px}
  #chat button{font-size:11.5px}
  #tour{font-size:9.5px}
}
@media (min-width:2560px){
  :root{--railL:340px;--railR:360px;--cL:432px;--cR:452px}
  #data{grid-template-columns:minmax(0,1fr) 340px}
  #chat{width:640px}
}
/* below 1600px the rails are narrow: let long values wrap in two
   lines rather than ellipsize away real data */
@media (max-width:1599px){
  #kvs .kv,#addonbody .kv{flex-wrap:wrap}
  #kvs .kv span,#addonbody .kv span{white-space:normal}
  #kvs .kv b,#addonbody .kv b{white-space:normal;word-break:break-word;flex:1 1 auto;padding-left:8px}
}
/* short viewports (<=820px tall): cap the stretchy panels so both
   rails still fit; fades hide the clip instead of a hard cut */
@media (max-height:820px){
  #addons{max-height:140px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent);
    mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent)}
  #gpuhist{display:none}
  #gpu{max-height:150px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent);
    mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent)}
  #flows{min-height:80px;
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent);
    mask-image:linear-gradient(180deg,#000 calc(100% - 12px),transparent)}
  body.has-alerts #alerts{max-height:120px}
  #feeds .cam img{aspect-ratio:16/10}
  .op b{font-size:12px}
  .op small{font-size:8.5px;line-height:1.3}
}

/* focuscard-nocut: the title was clipped at BOTH ends - the card is centred with
   max-width:380px and .panel sets overflow:hidden, so a long device name lost its
   first and last characters. Let it grow to the TV safe area and wrap instead. */
#focuscard{max-width:min(760px, calc(100vw - 2*var(--sx) - 24px)) !important;
  overflow:visible !important}
#focuscard .fn{white-space:normal !important; overflow-wrap:anywhere;
  line-height:1.25; padding:0 2px}
#focuscard .fm{flex-wrap:wrap; row-gap:4px}

/* ---- 11. broadcast pop ------------------------------------------
   --tour / --tour-glow / --tour-soft are published by netscene_exo.js from the
   tour's current stop (amber at the WAN edge, a guest category's hue in its
   block, cyan at the overview). Chrome follows the camera; ink does not. */
:root{--tour:#5ad7ff;--tour-glow:rgba(90,215,255,.45);--tour-soft:rgba(90,215,255,.16)}
.chip:empty{display:none}
.chip.cf{color:#ffb073;border-color:rgba(246,130,31,.45);background:rgba(246,130,31,.06)}
.chip.warn{color:var(--warn);border-color:rgba(255,179,71,.45)}
/* crisper panel edges: a hairline gradient border keyed to the tour colour */
.panel{border-color:rgba(125,160,200,.14);
  box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.panel:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(135deg,var(--tour-glow),transparent 38%,transparent 62%,var(--tour-soft));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  transition:background .9s ease}
#title.panel:before,#stat.panel:before{opacity:.75;transition:background .9s ease;
  background:linear-gradient(90deg,transparent,var(--tour),transparent)}
/* vignette between the scene and the HUD: focus, not darkness (stays clear of the centre) */
body:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 82% 74% at 50% 47%,transparent 60%,rgba(0,2,8,.40) 100%)}
/* numerals never jitter */
#stat .n,#hstats b,#herobot b,#st-live .tc,#cin .cstats,#focuscard .fm b,#clk{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
#hbrand .wm{text-shadow:0 0 22px var(--tour-glow)}
/* LIVE pill: a broadcast bug, not a chip */
body #st-live{background:linear-gradient(180deg,rgba(14,20,34,.94),rgba(6,10,20,.90));
  border:1px solid rgba(255,90,106,.32);border-radius:999px;
  box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.45),0 0 18px rgba(255,90,106,.10),inset 0 1px 0 rgba(255,255,255,.06)}
body #st-live .live{text-shadow:0 0 10px rgba(255,90,106,.55)}
body #st-live .dot{animation:st-livedot 2s ease-in-out infinite}
@keyframes st-livedot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
/* lower third: soft plate, tour-coloured underline and progress tick */
body #cin{padding:8px 22px 9px;border-radius:8px;
  background:linear-gradient(90deg,transparent,rgba(6,10,20,.74) 20%,rgba(6,10,20,.74) 80%,transparent)}
body #cin:before{content:"";position:absolute;left:50%;bottom:0;width:240px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,var(--tour),transparent);opacity:.85;transition:background .9s ease}
body #cin .cname{text-shadow:0 0 16px var(--tour-glow),0 1px 2px rgba(0,0,0,.85)}
body #cin .cbar i.now{background:var(--tour);box-shadow:0 0 8px var(--tour-glow)}
/* the whole scene shares one tour hue at the panel hairlines; keep #tip readable on any palette */
#tip{background:rgba(4,10,22,.97);border-color:var(--tour-soft);box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.5)}

/* ---- 12. dense-HUD polish ------------------------------------------
   The brand panel's edge chips carry a whole sentence (PoP list, last
   attacker) and #title is 228-280 px wide with overflow:hidden, so on
   camera they read as a clipped fragment. Each chip now ellipsises
   inside the panel instead of being cut mid-glyph; the chip text itself
   is also shorter (see chips() below). The hero-only audience panel
   (hero.js #h-aud) belongs to the hero layout only - in the full HUD it
   would sit on top of the right rail. */
#clockbar .chip{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;line-height:1.75}
#clockbar .chip.good:before,#clockbar .chip.bad:before{display:inline-block;margin-right:5px;vertical-align:1px}
body:not(.hero) #h-aud{display:none!important}
</style></head><body>
